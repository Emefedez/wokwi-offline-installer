<svg xmlns="http://www.w3.org/2000/svg" width="156" height="256" viewBox="0 0 156 256">
  <defs>
    <g id="epd-hole">
      <circle cx="0" cy="0" r="3.4" fill="#090d14" stroke="#eab308" stroke-width="1.5"/>
    </g>
  </defs>
  <!-- WeAct Studio White/Blue E-Paper Module PCB -->
  <rect x="2" y="2" width="152" height="252" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Left & Right SPI Pin Headers (BUSY, RST, DC, CS / CLK, DIN, VCC, GND) -->
  <use href="#epd-hole" x="10" y="20"/>
  <use href="#epd-hole" x="10" y="35"/>
  <use href="#epd-hole" x="10" y="50"/>
  <use href="#epd-hole" x="10" y="65"/>
  <use href="#epd-hole" x="146" y="20"/>
  <use href="#epd-hole" x="146" y="35"/>
  <use href="#epd-hole" x="146" y="50"/>
  <use href="#epd-hole" x="146" y="65"/>
  <g fill="#e2e8f0" font-family="monospace" font-size="6.8" font-weight="bold">
    <text x="17" y="22.5">BUSY</text>
    <text x="17" y="37.5">RST</text>
    <text x="17" y="52.5">DC</text>
    <text x="17" y="67.5">CS</text>
  </g>
  <g fill="#e2e8f0" font-family="monospace" font-size="6.8" font-weight="bold" text-anchor="end">
    <text x="139" y="22.5">CLK</text>
    <text x="139" y="37.5">DIN</text>
    <text x="139" y="52.5">VCC</text>
    <text x="139" y="67.5">GND</text>
  </g>
  <!-- White E-Ink Glass Substrate & Active Paper Area -->
  <rect x="34" y="12" width="88" height="206" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="39" y="18" width="78" height="178" rx="1.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <!-- High-Contrast B/W E-Ink Display Content -->
  <rect x="39" y="18" width="78" height="15" fill="#0f172a"/>
  <text x="78" y="28.5" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="bold">WeAct 2.13" EPD</text>
  <text x="43" y="45" fill="#0f172a" font-family="monospace" font-size="6.8" font-weight="bold">CAS: ∫sin(x)dx</text>
  <text x="113" y="56" text-anchor="end" fill="#0f172a" font-family="monospace" font-size="7.5" font-weight="bold">= -cos(x) + C</text>
  <line x1="42" y1="62" x2="114" y2="62" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="2 2"/>
  <!-- Plotted Sine Curve on E-Paper -->
  <line x1="44" y1="95" x2="112" y2="95" stroke="#64748b" stroke-width="0.6"/>
  <line x1="78" y1="68" x2="78" y2="122" stroke="#64748b" stroke-width="0.6"/>
  <path d="M 44 95 Q 61 66, 78 95 T 112 95" fill="none" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="42" y1="128" x2="114" y2="128" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="2 2"/>
  <text x="43" y="141" fill="#0f172a" font-family="monospace" font-size="6.5" font-weight="bold">CAN: 0x120 500k</text>
  <text x="43" y="153" fill="#0f172a" font-family="monospace" font-size="6.5">STR: 90° THR:50%</text>
  <text x="43" y="165" fill="#0f172a" font-family="monospace" font-size="6.5">BAT: 4.18V (96%)</text>
  <rect x="43" y="174" width="70" height="14" rx="1.5" fill="#0f172a"/>
  <text x="78" y="183.5" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="bold">SSD1680 122x250</text>
  <!-- Bottom Orange Polyimide FPC Ribbon Cable -->
  <path d="M 54 218 L 102 218 L 96 248 L 60 248 Z" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <rect x="64" y="222" width="28" height="10" rx="1" fill="#18181b"/>
  <text x="78" y="243" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="5.8" font-weight="bold">FPC-8101</text>
</svg>
