<svg xmlns="http://www.w3.org/2000/svg" width="136" height="84" viewBox="0 0 136 84">
  <defs>
    <g id="irf-hole">
      <circle cx="0" cy="0" r="3.5" fill="#090d14" stroke="#eab308" stroke-width="1.5"/>
    </g>
    <g id="screw-head">
      <circle cx="0" cy="0" r="4.5" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
      <line x1="-3" y1="-2" x2="3" y2="2" stroke="#334155" stroke-width="1.2"/>
    </g>
  </defs>
  <!-- Dark Navy/Black IRF520 Breakout PCB -->
  <rect x="2" y="2" width="132" height="80" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="10" cy="10" r="3" fill="#090d14" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="10" cy="74" r="3" fill="#090d14" stroke="#94a3b8" stroke-width="1"/>
  <!-- Left 3-Pin Control Header (SIG, VCC, GND) -->
  <rect x="5" y="20" width="10" height="44" rx="1.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <use href="#irf-hole" x="10" y="27"/>
  <use href="#irf-hole" x="10" y="42"/>
  <use href="#irf-hole" x="10" y="57"/>
  <g fill="#e2e8f0" font-family="monospace" font-size="7" font-weight="bold">
    <text x="18" y="29.5">SIG</text>
    <text x="18" y="44.5">VCC</text>
    <text x="18" y="59.5">GND</text>
  </g>
  <!-- SMD PWM Indicator LED & Gate Resistors -->
  <rect x="35" y="24" width="6" height="4" rx="0.8" fill="#22c55e" stroke="#bbf7d0" stroke-width="0.6"/>
  <rect x="35" y="34" width="7" height="3.5" fill="#0f172a" stroke="#94a3b8" stroke-width="0.5"/>
  <rect x="35" y="42" width="7" height="3.5" fill="#0f172a" stroke="#94a3b8" stroke-width="0.5"/>
  <!-- TO-220 IRF520N Power MOSFET + Aluminum Heatsink Tab -->
  <rect x="46" y="14" width="10" height="56" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <circle cx="51" cy="42" r="2.8" fill="#0f172a"/>
  <rect x="56" y="18" width="24" height="48" rx="2" fill="#18181b" stroke="#475569" stroke-width="1"/>
  <text x="68" y="39" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="6.8" font-weight="bold">IRF520N</text>
  <text x="68" y="49" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="6">24V 5A PWM</text>
  <!-- Right Blue Screw Terminal Blocks (VIN, VPLUS, VMINUS) -->
  <rect x="106" y="12" width="24" height="60" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <use href="#screw-head" x="115" y="24"/>
  <use href="#screw-head" x="115" y="42"/>
  <use href="#screw-head" x="115" y="60"/>
  <use href="#irf-hole" x="126" y="24"/>
  <use href="#irf-hole" x="126" y="42"/>
  <use href="#irf-hole" x="126" y="60"/>
  <g fill="#e0f2fe" font-family="monospace" font-size="6.5" font-weight="bold" text-anchor="end">
    <text x="103" y="26.5">VIN</text>
    <text x="103" y="44.5">VPLUS</text>
    <text x="103" y="62.5">VMINUS</text>
  </g>
</svg>
